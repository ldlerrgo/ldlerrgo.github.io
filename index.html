<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Citas</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-lights">
        <div class="light light-1"></div>
        <div class="light light-2"></div>
        <div class="light light-3"></div>
    </div>

    <main class="app-content">
        <h1 id="app-title">Nuestras citas de</h1>

        <div id="skeleton-container" class="active">
            <div class="skeleton-card">
                <div class="skeleton-title skeleton"></div>
                <div class="skeleton-text skeleton"></div>
                <div class="skeleton-text short skeleton"></div>
            </div>

            <div class="skeleton-card">
                <div class="skeleton-title skeleton"></div>
                <div class="skeleton-text skeleton"></div>
                <div class="skeleton-text short skeleton"></div>
            </div>

            <div class="skeleton-card">
                <div class="skeleton-title skeleton"></div>
                <div class="skeleton-text skeleton"></div>
                <div class="skeleton-text short skeleton"></div>
            </div>
        </div>

        <section id="calendar-view" class="calendar-view">
            <div class="calendar-header">
                <div>Dom</div>
                <div>Lun</div>
                <div>Mar</div>
                <div>Mié</div>
                <div>Jue</div>
                <div>Vie</div>
                <div>Sáb</div>
            </div>

            <div id="calendar-grid" class="calendar-grid"></div>

            <section class="monthly-list-section">
                <h2>Lista de citas del mes</h2>
                <div id="monthly-list" class="monthly-list"></div>
            </section>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
